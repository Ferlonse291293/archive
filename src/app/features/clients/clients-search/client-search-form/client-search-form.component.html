<form [formGroup]="form">
  <app-text-field
   [label]="'CLIENTS.CLIENT_SEARCH.FIRST_NAME' | translate"
    name="firstName"
    [control] = "form.controls.firstName"
  />

  <app-text-field
    [label]="'CLIENTS.CLIENT_SEARCH.LAST_NAME' | translate"
    name="lastName"
    [control] = "form.controls.lastName"
  />
  <app-text-field
    [label]="'CLIENTS.CLIENT_SEARCH.CODE_CLIENT' | translate"
    name="code"
    [control] = "form.controls.code"
  />

  <app-text-field
    [label]="'CLIENTS.CLIENT_SEARCH.TYPE' | translate"
    name="type"
    [control] = "form.controls.type"
  />

  <app-text-field
    [label]="'CLIENTS.CLIENT_SEARCH.IPN' | translate"
    name="ipn"
    [control] = "form.controls.ipn"
  />


  <app-text-field
    [label]="'CLIENTS.CLIENT_SEARCH.SERIES_IDENTITY_DOCUMENT' | translate"
    name="seriesDoc"
    [control] = "form.controls.seriesDoc"
  />


  <app-text-field
    [label]="'CLIENTS.CLIENT_SEARCH.NUMBER_IDENTITY_DOCUMENT' | translate"
    name="numberDoc"
    [control] = "form.controls.numberDoc"
  />

  <app-text-field
    [label]="'CLIENTS.CLIENT_SEARCH.DEPARTMENT' | translate"
    name="department"
    [control] = "form.controls.department"
  />


  <button type="submit"
          (click)="submit()"
          mat-stroked-button
  >
    search
  </button>

</form>
