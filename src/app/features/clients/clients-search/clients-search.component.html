<app-client-search-form
  (onSubmit) = "getClients($event)"
  [departments] = "departmentsOptions$ | async"
>
</app-client-search-form>
<app-table-dynamic
  [dataGridController] = "dataGridController"
  (clickRow) = "getClientDetails($event)"
/>
@if (dataGridController.getData().length !== 0){
  <app-paginator [paginatorController] = "dataGridController.paginator"/>
}
