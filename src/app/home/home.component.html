<div class="shell">

<app-header class="header-base" />

  <main class="main">

    <mat-sidenav-container class="container">

      <mat-sidenav clickOutside
                   (clickOutside)="sidebarService.clickOutside()"
                   [enabled]="sidebarService.isOpen()"
                   mode="side" [opened] = "sidebarService.isOpen() "
                   class="sidebar"

      >
        <app-sidebar-list />
      </mat-sidenav>

      <mat-sidenav-content class="content">
        <app-breadcrumbs />
        <router-outlet></router-outlet>
      </mat-sidenav-content>

    </mat-sidenav-container>

  </main>

  <app-footer class="footer" />

</div>
