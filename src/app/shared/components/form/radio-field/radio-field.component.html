<div class="app-radio-field">

  <label class="app-radio-field__label">
    {{ label() }}
  </label>
  <mat-form-field appearance="outline">
    <mat-label>
      {{ label() }}
    </mat-label>
  <mat-radio-group
    [value]="value"
    [disabled]="disabled"
    (change)="handle($event.value)"
  >

    @for (option of options(); track option.value) {

      <mat-radio-button
        [value]="option.value"
      >
        {{ option.label }}
      </mat-radio-button>

    }

  </mat-radio-group>

    <mat-hint [hidden]="!hint()">
      {{ hint() }}
    </mat-hint>


    <mat-error [hidden]="!error()">
      {{ error() }}
    </mat-error>

  </mat-form-field>
</div>
