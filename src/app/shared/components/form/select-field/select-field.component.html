
  <mat-form-field appearance="outline">
    <mat-label>
      {{ label() }}
    </mat-label>
  <mat-select
    [value]="value"
    [multiple]="multiple()"
    [disabled]="disabled"
    (valueChange)="handle($event)"
  >

    @for (option of options(); track option.value) {

      <mat-option [value]="option.value">
        {{ option.label }}
      </mat-option>

    }

  </mat-select>

    <mat-hint [hidden]="!hint()">
      {{ hint() }}
    </mat-hint>


    <mat-error [hidden]="!error()">
      {{ error() }}
    </mat-error>


  </mat-form-field>
