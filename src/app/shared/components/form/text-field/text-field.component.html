<mat-form-field appearance="outline" class="full-width">

  <mat-label>{{ label() }}</mat-label>

  <input
    matInput
    [id] ="id()"
    [formControl]="control()"
    [placeholder]="placeholder()"
    [required]="required()"
    [attr.required]="requiredMarked() ?? required()"
  />
    <mat-error>
      {{errors[0]}}
    </mat-error>
</mat-form-field>
