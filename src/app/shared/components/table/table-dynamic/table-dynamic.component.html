<div class="table-wrapper">
  <table mat-table [dataSource]="dataGridController()">
    @for ( col of table.columns() ; track col.keyCol){
      <ng-container [matColumnDef]="col.keyCol" >
        <th mat-header-cell *matHeaderCellDef (click)="table.clickHeadCol(col)"  > {{col.name | translate}} </th>
        <td mat-cell *matCellDef="let element" (click)="clickRow.emit(element)"> {{element[col.keyCol]}} </td>
      </ng-container>
    }
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
