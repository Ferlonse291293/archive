
<cdk-tree #tree [dataSource]="dataSource" [childrenAccessor]="childrenAccessor">


  <cdk-nested-tree-node  *cdkTreeNodeDef="let node; when: isDocument"
                        class="tree-node">
    <button matIconButton class="btn-icon ">
      <mat-icon class="mat-icon-document">description</mat-icon>
    </button>

    {{ node.name + ' 0.' + node.content.version }}
  </cdk-nested-tree-node>


  <cdk-nested-tree-node *cdkTreeNodeDef="let node; when: isFolder"
                        isExpandable
                        class="tree-node">

    <button matIconButton class="btn-icon " cdkTreeNodeToggle>
      <mat-icon class="mat-icon-folder">
        {{ tree.isExpanded(node) ? 'folder_open' : 'folder' }}
      </mat-icon>
    </button>

    {{ node.name }}

    <div [class.tree-invisible]="!tree.isExpanded(node)">
      <ng-container cdkTreeNodeOutlet></ng-container>
    </div>
  </cdk-nested-tree-node>
</cdk-tree>
