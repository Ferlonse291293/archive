
<cdk-tree #tree [dataSource]="dataSource" [childrenAccessor]="childrenAccessor">


  <cdk-nested-tree-node  *cdkTreeNodeDef="let node; when: isItem"
                        class="tree-node">
    <button matIconButton
            class="btn-icon tree-btn"
            (click)="onClickItem($event, node)"
    >
      <mat-icon class="mat-icon-item">description</mat-icon>
      <p class="tree-title">{{ node.name + ' 0.' + node.content.version }}</p>
    </button>

  </cdk-nested-tree-node>


  <cdk-nested-tree-node *cdkTreeNodeDef="let node; when: isFolder"
                        isExpandable
                        class="tree-node"
                        (click)="onClickFolder($event, node)"
  >

    <button matIconButton class="btn-icon tree-btn" cdkTreeNodeToggle>
      <mat-icon class="mat-icon-folder">
        {{ tree.isExpanded(node) ? 'folder_open' : 'folder' }}
      </mat-icon>
    <p class="tree-title">{{ node.name }}</p>
    </button>



    <div [class.tree-invisible]="!tree.isExpanded(node)">
      <ng-container cdkTreeNodeOutlet></ng-container>
    </div>
  </cdk-nested-tree-node>
</cdk-tree>
